name: Parallel macOS 

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Select macOS Version'
        required: true
        type: choice
        default: macos-latest
        options:
          - macos-latest   # macOS 14 (Sonoma)
          - macos-13       # macOS 13 (Ventura)
          - macos-12       # macOS 12 (Monterey)
      
      runner_count:
        description: 'Number of Parallel Runners'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

      ngrok_auth_1:
        description: 'Ngrok Token (Device 1)'
        required: true
        type: string
      ngrok_auth_2:
        description: 'Ngrok Token (Device 2)'
        required: false
        type: string
      ngrok_auth_3:
        description: 'Ngrok Token (Device 3)'
        required: false
        type: string
      ngrok_auth_4:
        description: 'Ngrok Token (Device 4)'
        required: false
        type: string
      ngrok_auth_5:
        description: 'Ngrok Token (Device 5)'
        required: false
        type: string

jobs:
  macos_vnc_session:
    name: Mac Session ${{ matrix.device }}
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: 1
            ngrok_token: ${{ github.event.inputs.ngrok_auth_1 }}
          - device: 2
            ngrok_token: ${{ github.event.inputs.ngrok_auth_2 }}
          - device: 3
            ngrok_token: ${{ github.event.inputs.ngrok_auth_3 }}
          - device: 4
            ngrok_token: ${{ github.event.inputs.ngrok_auth_4 }}
          - device: 5
            ngrok_token: ${{ github.event.inputs.ngrok_auth_5 }}

    steps:
      - name: Configure VNC and TCC Permissions
        if: ${{ matrix.device <= fromJson(github.event.inputs.runner_count) }}
        env:
          NGROK_AUTH_TOKEN: ${{ matrix.ngrok_token }}
          MY_PASSWORD: "Password123!" 
        run: |
          if[ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "❌ Error: No Ngrok Token provided for Device ${{ matrix.device }}."
            exit 1
          fi
          
          echo "🔧 Setting password for the active 'runner' user..."
          # ✅ FIX 1: Use the default 'runner' account to hook into the active physical display
          sudo dscl . -passwd /Users/runner "$MY_PASSWORD"
          
          echo "🔧 Bypassing macOS TCC Screen Capture restrictions..."
          # ✅ FIX 2: Inject Screen Recording permissions directly into the macOS TCC database
          os_version=$(sw_vers -productVersion | cut -d. -f1)
          for agent in "com.apple.screensharing.agent" "com.apple.RemoteDesktop.agent"; do
            if [ "$os_version" -ge 14 ]; then
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1687786159,NULL,NULL,'UNUSED',1687786159);"
            else
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','$agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1687786159);"
            fi
          done
          
          echo "🔧 Installing Ngrok..."
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          echo "🔧 Enabling Screen Sharing..."
          # Grant access to 'runner'
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runner \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$MY_PASSWORD" \
            -restart -agent -privs -all
            
          # Start Ngrok Tunnel
          ngrok tcp 5900 --log=stdout > ngrok.log &
          
          echo "Waiting for tunnel..."
          sleep 10
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          
          echo "========================================================="
          echo "✅ LOGIN DETAILS (USE THESE EXACTLY)"
          echo "---------------------------------------------------------"
          echo "👤 Username: runner"
          echo "🔑 Password: Password123!"
          echo "🔗 URL:      $NGROK_URL"
          echo "========================================================="

      - name: Keep Runner Alive
        if: ${{ success() && matrix.device <= fromJson(github.event.inputs.runner_count) }}
        run: |
          echo "Session active. Sleeping for 60 mins..."
          sleep 3600
