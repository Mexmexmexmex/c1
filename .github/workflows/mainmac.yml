name: Parallel macOS 

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Select macOS Version'
        required: true
        type: choice
        default: macos-latest
        options:
          - macos-latest   # macOS 14 (Sonoma)
          - macos-13       # macOS 13 (Ventura)
          - macos-12       # macOS 12 (Monterey)
      
      runner_count:
        description: 'Number of Parallel Runners'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

      ngrok_auth_1:
        description: 'Ngrok Token (Device 1)'
        required: true
        type: string
      ngrok_auth_2:
        description: 'Ngrok Token (Device 2)'
        required: false
        type: string
      ngrok_auth_3:
        description: 'Ngrok Token (Device 3)'
        required: false
        type: string
      ngrok_auth_4:
        description: 'Ngrok Token (Device 4)'
        required: false
        type: string
      ngrok_auth_5:
        description: 'Ngrok Token (Device 5)'
        required: false
        type: string

jobs:
  macos_vnc_session:
    name: Mac Session ${{ matrix.device }}
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: 1
            ngrok_token: ${{ github.event.inputs.ngrok_auth_1 }}
          - device: 2
            ngrok_token: ${{ github.event.inputs.ngrok_auth_2 }}
          - device: 3
            ngrok_token: ${{ github.event.inputs.ngrok_auth_3 }}
          - device: 4
            ngrok_token: ${{ github.event.inputs.ngrok_auth_4 }}
          - device: 5
            ngrok_token: ${{ github.event.inputs.ngrok_auth_5 }}

    steps:
      - name: Create Admin User & Configure VNC
        if: ${{ matrix.device <= fromJson(github.event.inputs.runner_count) }}
        env:
          NGROK_AUTH_TOKEN: ${{ matrix.ngrok_token }}
          # This will be the password for BOTH the new user and VNC
          MY_PASSWORD: "Password123!" 
        run: |
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "❌ Error: No Ngrok Token provided for Device ${{ matrix.device }}."
            exit 1
          fi

          echo "🔧 Creating new admin user 'adminuser'..."
          # 1. Create a new user named 'adminuser'
          sudo dscl . -create /Users/adminuser
          sudo dscl . -create /Users/adminuser UserShell /bin/bash
          sudo dscl . -create /Users/adminuser RealName "Admin User"
          sudo dscl . -create /Users/adminuser UniqueID "502"
          sudo dscl . -create /Users/adminuser PrimaryGroupID 20
          sudo dscl . -create /Users/adminuser NFSHomeDirectory /Users/adminuser
          
          # 2. Set the password for 'adminuser'
          sudo dscl . -passwd /Users/adminuser "$MY_PASSWORD"
          
          # 3. Grant Admin Privileges
          sudo dscl . -append /Groups/admin GroupMembership adminuser

          echo "🔧 Installing Ngrok..."
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_AUTH_TOKEN

          echo "🔧 Enabling Screen Sharing..."
          # 4. Enable VNC and allow the new user to login
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -clientopts -setvnclegacy -vnclegacy yes \
          -clientopts -setvncpw -vncpw "$MY_PASSWORD" \
          -restart -agent -privs -all

          # Start Ngrok Tunnel
          ngrok tcp 5900 --log=stdout > ngrok.log &
          
          echo "Waiting for tunnel..."
          sleep 10
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          echo "========================================================="
          echo "✅ LOGIN DETAILS (USE THESE EXACTLY)"
          echo "---------------------------------------------------------"
          echo "👤 Username: adminuser"
          echo "🔑 Password: Password123!"
          echo "🔗 URL:      $NGROK_URL"
          echo "========================================================="

      - name: Keep Runner Alive
        if: ${{ success() && matrix.device <= fromJson(github.event.inputs.runner_count) }}
        run: |
          echo "Session active. Sleeping for 60 mins..."
          sleep 3600
